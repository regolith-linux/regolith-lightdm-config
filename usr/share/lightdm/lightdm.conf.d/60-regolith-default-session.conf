[Seat:*]
user-session=regolith-x11
# lightdm depends on "lightdm-gtk-greeter | lightdm-greeter", so apt can
# install lightdm-gtk-greeter next to slick-greeter. Its
# 60-lightdm-gtk-greeter.conf would then win over 50-slick-greeter.conf.
# This file is read after both, so slick-greeter, which etc/lightdm/
# slick-greeter.conf configures for Regolith, stays the greeter.
greeter-session=slick-greeter
